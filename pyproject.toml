[project]
name = "cnn1d-ae"
version = "0.1.0"
description = "CNN-1D Autoencoder + KerasTuner trials for anomaly detection in time series"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "tensorflow>=2.16",
  "keras-tuner>=1.4.6",
  "clearml>=1.16.5",
]

[project.optional-dependencies]
# Detector de 4 sinais / manutencao preditiva do TC-330.03A (src/cabiunas_pdm).
# Nao usa TensorFlow: os modelos sao scikit-learn (PCA, IsolationForest, MLP).
pdm = [
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "pyarrow>=16",
  "joblib>=1.4",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
