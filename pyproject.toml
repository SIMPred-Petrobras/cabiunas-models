[project]
name = "cnn1d-ae"
version = "0.1.0"
description = "CNN-1D Autoencoder + KerasTuner trials for anomaly detection in time series"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "tensorflow>=2.16",
  "keras-tuner>=1.4.6",
  "clearml>=1.16.5",
  "scikit-learn>=1.3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
